name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (python 3.13, pip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e '.[dev]'
      - name: Test
        run: pytest --cov=tsupdate --cov-report=term-missing

  trixie:
    # tsupdate targets Debian 13 (trixie): run the tests against the Python and
    # the python3-github / python3-yaml / python3-requests that Debian ships.
    name: pytest (debian trixie packages)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git python3 python3-venv python3-pip \
            python3-github python3-yaml python3-requests python3-pytest
      - uses: actions/checkout@v7
      - name: Install (system packages + scheduleparse from git)
        run: |
          python3 -m venv --system-site-packages /opt/venv
          /opt/venv/bin/pip install -e .
      - name: Test
        run: /opt/venv/bin/python -m pytest
